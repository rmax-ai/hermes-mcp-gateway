[project]
name = "hermes-mcp-gateway"
version = "0.1.0"
description = "Governed MCP gateway exposing Hermes Agent task execution to remote MCP clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pyjwt>=2.8",
]

[project.scripts]
hermes-mcp-gateway = "hermes_mcp_gateway.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
