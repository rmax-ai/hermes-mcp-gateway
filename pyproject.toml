[project]
name = "hermes-mcp-gateway"
version = "0.1.0"
description = "Governed MCP gateway exposing Hermes Agent task execution to remote MCP clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "pyjwt>=2.8",
]

[project.scripts]
hermes-mcp-gateway = "hermes_mcp_gateway.cli:main"

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-http>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Vendored canonical shim (synced byte-identical from the lab's sync-shim); its
# style is governed by the canonical copy, not this repo.
[tool.ruff.lint.per-file-ignores]
"src/hermes_mcp_gateway/telemetry.py" = ["E501", "I001", "RUF100"]
